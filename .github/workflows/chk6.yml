name: chk6
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk6.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 79
          timeout: 20s
          command_timeout: 2m
          script: |
            export PATH=/usr/syno/sbin:/usr/syno/bin:/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin:$PATH
            cd /usr/local/etc/nginx/sites-enabled
            ls -la --time-style=full-iso server.ReverseProxy.conf
            echo "=== summary"; grep -cE "^\s*server \{" server.ReverseProxy.conf; grep -nE "listen .*443" server.ReverseProxy.conf | wc -l
            echo "=== loov block"; awk '/^server \{/{b=""; keep=0} {b=b"\n"$0} /server_name.*loov\.co\.kr/{keep=1} /^}/{if(keep) print b; keep=0}' server.ReverseProxy.conf | head -60
            echo "=== all server_name + listen 443 lines (first 25)"; grep -nE "server_name|listen .*443|ssl_certificate|include .*cert" server.ReverseProxy.conf | head -30
