name: chk6
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk6.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 79
          timeout: 20s
          command_timeout: 2m
          script: |
            export PATH=/usr/syno/sbin:/usr/syno/bin:/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin:$PATH
            ls -la --time-style=full-iso /usr/local/etc/nginx/conf.d/ 2>&1 | head -20
            echo "=== loov.co.kr.conf"; cat /usr/local/etc/nginx/conf.d/loov.co.kr.conf 2>&1 | head -60
            echo "=== w3conf"; cat /usr/local/etc/nginx/sites-available/42df4b5e-02bd-4bf6-a5ae-202848823f16.w3conf 2>&1 | head -40
            echo "=== ssl lines in nginx.conf"; grep -nE "ssl|server_name|include|default_server" /etc/nginx/nginx.conf | head -40
