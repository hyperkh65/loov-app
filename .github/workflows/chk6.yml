name: chk6
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk6.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 79
          timeout: 20s
          command_timeout: 2m
          script: |
            export PATH=/usr/syno/sbin:/usr/syno/bin:/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin:$PATH
            cd /usr/local/etc/nginx
            echo "=== files mentioning loov.co.kr (follow symlinks)"
            grep -Rl "loov.co.kr" conf.d conf.d-available sites-available sites-enabled 2>/dev/null | head -10
            f=$(grep -Rl "server_name.*loov.co.kr" conf.d conf.d-available sites-available 2>/dev/null | grep -v "^conf.d/loov.co.kr.conf" | head -1)
            echo "=== 443 block file: $f"; [ -n "$f" ] && ls -la --time-style=full-iso "$f" && cat "$f" | head -50
            echo "=== cert references"; grep -Rhn "ssl_certificate" conf.d conf.d-available sites-available 2>/dev/null | sort | uniq -c | sort -rn | head -10
            echo "=== conf.d recent changes"; find conf.d conf.d-available sites-available -maxdepth 1 -newermt "2026-10-17 20:00" 2>/dev/null | head -10
