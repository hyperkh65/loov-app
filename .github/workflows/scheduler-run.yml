name: Scheduler Run

on:
  # 2026-09-17: 해외(GitHub Actions) IP가 NAS 방화벽에 막혀 스케줄 트리거가
  # 대부분 실패하고 있었고, 가끔 통과할 때 NAS 로컬 크론(5분마다, /etc/crontab)과
  # 겹쳐서 같은 스케줄이 초 단위로 두 번 실행되는 중복 발행 사고로 이어짐
  # (2days.kr 글 중복). 로컬 크론이 안정적으로 대신하고 있으므로 자동 스케줄은
  # 끄고 수동 실행(workflow_dispatch)만 남김.
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: 스케줄러 실행 (/api/scheduler/run)
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/scheduler/run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 --fail-with-body
