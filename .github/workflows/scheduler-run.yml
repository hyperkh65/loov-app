name: Scheduler Run

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 — bossai_schedules 중 실행 시각이 된 것만 처리됨
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: 스케줄러 실행 (/api/scheduler/run)
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/scheduler/run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 --fail-with-body
