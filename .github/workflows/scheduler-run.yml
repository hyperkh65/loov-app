name: Scheduler Run

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 — bossai_schedules 중 실행 시각이 된 것만 처리됨
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: 디버그 - URL 확인 (다른 크론은 성공하는데 이것만 실패해서 원인 확인용, 시크릿값은 GH가 자동 마스킹함)
        run: echo "target=${{ secrets.APP_URL }}/api/scheduler/run"
      - name: 스케줄러 실행 (/api/scheduler/run)
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/scheduler/run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 300 --fail-with-body
