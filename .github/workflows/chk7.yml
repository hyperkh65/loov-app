name: chk7
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk7.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 79
          timeout: 20s
          command_timeout: 3m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            IMG=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^(alpine|busybox|ubuntu|debian)' | head -1)
            [ -z "$IMG" ] && IMG=$(docker inspect loov-app --format '{{.Config.Image}}')
            echo "image=$IMG"
            timeout 90 docker run --rm --pull=never -v /usr/syno/etc/www:/w:ro -v /usr/local/etc/nginx:/n:ro --entrypoint sh "$IMG" -c '
              echo "=== certificate dir"; ls -la /w/certificate/ | head -40
              echo "=== system_default"; ls -la /w/certificate/system_default/
              echo "=== ReverseProxy dirs content (counts)"; for d in /w/certificate/ReverseProxy_*; do echo "$d: $(ls $d | tr "\n" " ")"; done | head -40
              echo "=== loov.co.kr / aboda.kr server blocks in nginx"; grep -rnE "server_name.*(loov\.co\.kr|aboda\.kr)" /n 2>/dev/null | head
              echo "=== DSM cert registry"; ls -la /w/../certificate/ 2>/dev/null | head -3
            '
