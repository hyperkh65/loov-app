name: chk3
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk3.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 79
          timeout: 20s
          command_timeout: 2m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            echo START
            timeout 60 docker logs --since 120m --tail 3000 loov-app 2>&1 | grep -iE "post-now|sns|instagram|telegram|bluesky|tumblr|pinterest|backlink|fetch failed|ECONN|permission|401" | cut -c1-300 | tail -50
            echo END
