name: chk3
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk3.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 79
          timeout: 20s
          command_timeout: 3m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            echo START
            timeout 40 docker exec loov-app node -e "fetch('https://loov.co.kr/api/sns/post-now',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(async r=>console.log('SELF',r.status,(await r.text()).slice(0,120))).catch(e=>console.log('SELFERR',e.message,e.cause&&e.cause.code))" 2>&1 | head -5
            timeout 40 docker exec loov-app node -e "fetch('https://sb.2days.kr/auth/v1/health').then(r=>console.log('SB',r.status)).catch(e=>console.log('SBERR',e.message,e.cause&&e.cause.code))" 2>&1 | head -3
            echo END
