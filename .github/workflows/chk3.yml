name: chk3
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk3.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          port: 79
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          envs: NAS2_PASS
          script: |
            cat > /tmp/chk3.sql <<'SQL'
            select platform, platform_username, (access_token is not null and length(access_token)>10) as has_token, (refresh_token is not null) as has_refresh, token_expires_at at time zone 'Asia/Seoul' as exp from public.sns_connections order by platform, platform_username;
            select c.relname, c.relrowsecurity as rls, (select count(*) from pg_policy p where p.polrelid=c.oid) as policies from pg_class c where c.relname in ('sns_connections','sns_post_logs','bossai_auto_articles','backlink_settings') and c.relkind='r';
            select id, status, to_char(updated_at at time zone 'Asia/Seoul','MM-DD HH24:MI') upd, sns_platforms::text, left(published_urls::text,200) urls from public.bossai_auto_articles where updated_at > now() - interval '14 hours' order by updated_at desc limit 8;
            select table_name from information_schema.tables where table_schema='public' and (table_name like '%backlink%' or table_name like '%tumblr%' or table_name like '%pinterest%');
            SQL
            echo "$NAS2_PASS" | sudo -S -p '' sh -c "cat /tmp/chk3.sql | /usr/local/bin/docker exec -i supabase-db psql -U postgres -d postgres -P pager=off"
            rm -f /tmp/chk3.sql
