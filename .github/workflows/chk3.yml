name: chk3
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk3.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 79
          timeout: 20s
          command_timeout: 3m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            echo START
            docker ps --format '{{.Names}} {{.Status}}' | grep -i loov
            timeout 90 docker logs --tail 1500 loov-app > /tmp/l.txt 2>&1; wc -l /tmp/l.txt
            grep -iE "post-now|sns|instagram|telegram|bluesky|tumblr|pinterest|backlink|fetch failed|ECONN|permission|401" /tmp/l.txt | cut -c1-300 | tail -40
            echo ---LASTLINES
            tail -8 /tmp/l.txt | cut -c1-200
            rm -f /tmp/l.txt
            echo END
