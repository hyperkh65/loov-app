name: checksns
on:
  push:
    branches: [dr-sync]
    paths: [".github/workflows/checksns.yml"]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          port: 79
          envs: NAS2_PASS
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            cat > /tmp/cs.sql <<'SQL'
            select 'LOGS' k, to_char(max(created_at) at time zone 'Asia/Seoul','MM-DD HH24:MI') last, count(*) n from public.sns_post_logs;
            select 'LOG' k, platform, status, to_char(created_at at time zone 'Asia/Seoul','MM-DD HH24:MI') at, left(coalesce(error_message,''),100) note from public.sns_post_logs order by created_at desc limit 12;
            select 'CONN' k, platform, is_active, platform_username, to_char(updated_at at time zone 'Asia/Seoul','MM-DD HH24:MI') upd from public.sns_connections order by platform;
            select 'AUTO' k, user_id, enabled from public.bossai_auto_settings;
            SQL
            echo "$NAS2_PASS" | sudo -S -p '' sh -c "cat /tmp/cs.sql | docker exec -i supabase-db psql -U postgres -d postgres -P pager=off 2>&1"
            rm -f /tmp/cs.sql
