name: checksns
on:
  push:
    branches: [dr-sync]
    paths: [".github/workflows/checksns.yml"]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          port: 79
          envs: NAS2_PASS
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            cat > /tmp/cs.sql <<'SQL'
            select 'P' k, platform, status, count(*) n, to_char(max(posted_at) at time zone 'Asia/Seoul','MM-DD HH24:MI') last from public.sns_post_logs where posted_at > now() - interval '48 hours' group by 2,3 order by 2,3;
            select 'E' k, platform, to_char(posted_at at time zone 'Asia/Seoul','MM-DD HH24:MI') at, left(error_message,120) note from public.sns_post_logs where status='failed' order by posted_at desc limit 8;
            SQL
            echo "$NAS2_PASS" | sudo -S -p '' sh -c "cat /tmp/cs.sql | docker exec -i supabase-db psql -U postgres -d postgres -P pager=off 2>&1"
            rm -f /tmp/cs.sql
