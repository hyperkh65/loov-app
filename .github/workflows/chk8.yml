name: chk8
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk8.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 79
          timeout: 20s
          command_timeout: 3m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            IMG=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E '^(alpine|busybox|ubuntu|debian)' | head -1)
            [ -z "$IMG" ] && IMG=$(docker inspect loov-app --format '{{.Config.Image}}')
            echo "image=$IMG"
            timeout 90 docker run --rm --pull=never -v /usr/syno/etc/www:/w:ro -v /usr/local/etc/nginx:/n:ro --entrypoint sh "$IMG" -c '
              echo "=== system_default/cert.conf"; cat /w/certificate/system_default/cert.conf
              echo "=== loov block (w3conf 505-560)"; sed -n "505,560p" /n/sites-available/42df4b5e-02bd-4bf6-a5ae-202848823f16.w3conf
              echo "=== cert.conf of all ReverseProxy dirs"; for d in /w/certificate/ReverseProxy_*; do echo "-- $d"; cat $d/cert.conf; done
              echo "=== which uuid dirs are referenced by w3conf"; grep -noE "ReverseProxy_[0-9a-f-]+" /n/sites-available/42df4b5e-02bd-4bf6-a5ae-202848823f16.w3conf | sort -u -t: -k2 | head -40
              echo "=== grep loov.co.kr in all of /n incl 443"; grep -rnE "listen.*443" /n/sites-available/42df4b5e-02bd-4bf6-a5ae-202848823f16.w3conf | wc -l
              echo "=== DSM cert dir (SYNO.cert)"; ls /w/../../ssl 2>&1 | head; ls -la /w/../certificate 2>&1 | head -3
            '
