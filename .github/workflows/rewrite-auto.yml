name: Rewrite Auto-Run

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      max:
        description: '최대 리라이팅 수'
        default: '2'
      ai_model:
        description: 'AI 모델'
        default: 'qwen3'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: 리라이팅 자동 실행
        run: |
          MAX="${{ github.event.inputs.max || '2' }}"
          MODEL="${{ github.event.inputs.ai_model || 'qwen3' }}"
          curl -s -X POST "${{ secrets.APP_URL }}/api/rewrite/auto-run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"max\":${MAX},\"ai_model\":\"${MODEL}\"}" \
            --max-time 540 --fail-with-body
