name: LED 데이터 수집 (Danawa)

on:
  schedule:
    # 매일 오전 6시 (KST = UTC+9, so 21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '수동 실행 이유'
        required: false
        default: '수동 트리거'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: LED 데이터 수집 트리거
        run: |
          echo "다나와 LED 데이터 수집 시작..."
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.LED_SCRAPE_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.APP_URL }}/api/led/scrape")

          echo "HTTP Status: $RESPONSE"
          cat /tmp/response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ 수집 실패 (HTTP $RESPONSE)"
            exit 1
          fi

          COLLECTED=$(cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('collected', 0))")
          TOTAL=$(cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total', 0))")
          echo "✅ 수집 완료: $COLLECTED개 신규, 총 $TOTAL개"
