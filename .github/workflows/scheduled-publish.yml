name: 예약 발행 실행

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다
  workflow_dispatch:         # 수동 실행 가능

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 예약 발행 API 호출
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/auto-service/scheduled-run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 320 \
            --fail-with-body
