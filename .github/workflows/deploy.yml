name: Deploy to NAS

on:
  push:
    branches: [main]

env:
  WEBHOOK_URL: https://loov.co.kr/api/deploy/webhook
  DIST_DIR: /volume1/web/loov-dist

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Notify — 배포 시작
        run: |
          curl -s -X POST $WEBHOOK_URL \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DEPLOY_SECRET }}\",\"status\":\"queued\",\"step\":\"GitHub Actions 시작\",\"sha\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"triggered_by\":\"${{ github.actor }}\"}" || true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Notify — 빌드 시작
        run: |
          curl -s -X POST $WEBHOOK_URL \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DEPLOY_SECRET }}\",\"status\":\"building\",\"step\":\"npm 패키지 설치 중\",\"sha\":\"${{ github.sha }}\"}" || true

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://loov.co.kr
          NEXT_PUBLIC_MAIN_DOMAIN: loov.co.kr
          NEXT_PUBLIC_OWNER_DOMAIN: loov.co.kr
          NEXT_PUBLIC_SERVICE_DOMAIN: service.loov.co.kr
          NEXT_PUBLIC_OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          NEXT_PUBLIC_OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          NEXT_PUBLIC_KAKAO_CHANNEL_URL: https://pf.kakao.com/_ixeGIX

      - name: Prepare dist
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/static

      - name: Write .env.production
        run: |
          cat > .next/standalone/.env.production << 'ENVEOF'
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OWNER_USER_ID=${{ secrets.OWNER_USER_ID }}
          OWNER_EMAIL=${{ secrets.OWNER_EMAIL }}
          NEXT_PUBLIC_OWNER_USER_ID=${{ secrets.OWNER_USER_ID }}
          NEXT_PUBLIC_OWNER_EMAIL=${{ secrets.OWNER_EMAIL }}
          NEXT_PUBLIC_OWNER_DOMAIN=loov.co.kr
          NEXT_PUBLIC_SERVICE_DOMAIN=service.loov.co.kr
          NEXT_PUBLIC_APP_URL=https://loov.co.kr
          NEXT_PUBLIC_MAIN_DOMAIN=loov.co.kr
          NAS_SSH_HOST=host.docker.internal
          NAS_SSH_PORT=22
          NAS_SSH_USER=${{ secrets.NAS_SSH_USER }}
          NAS_SSH_PASSWORD=${{ secrets.NAS_SSH_PASSWORD }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET=${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
          NOTION_API_KEY=${{ secrets.NOTION_API_KEY }}
          NOTION_CAMERA_DB_ID=${{ secrets.NOTION_CAMERA_DB_ID }}
          GITHUB_PAT=${{ secrets.PAT_TOKEN }}
          GITHUB_REPO=hyperkh65/loov-app
          INVITE_CODE=${{ secrets.INVITE_CODE }}
          NAS_MYSQL_ROOT_PASS=${{ secrets.NAS_MYSQL_ROOT_PASS }}
          NAS_SYNO_ADMIN_PASS=${{ secrets.NAS_SYNO_ADMIN_PASS }}
          NEXT_PUBLIC_KAKAO_CHANNEL_URL=https://pf.kakao.com/_ixeGIX
          DEPLOY_SECRET=${{ secrets.DEPLOY_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=https://loov.co.kr/api/google/callback
          ENVEOF

      - name: Notify — 전송 중
        run: |
          curl -s -X POST $WEBHOOK_URL \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DEPLOY_SECRET }}\",\"status\":\"deploying\",\"step\":\"NAS로 파일 전송 중\",\"sha\":\"${{ github.sha }}\"}" || true

      - name: Upload to NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 22
          source: ".next/standalone/*"
          target: ${{ env.DIST_DIR }}
          strip_components: 2
          rm: false

      - name: Restart container on NAS
        uses: appleboy/ssh-action@v1
        env:
          DIST_DIR: /volume1/web/loov-dist
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SHA: ${{ github.sha }}
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 22
          envs: DIST_DIR,DEPLOY_SECRET,SHA
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            WEBHOOK_URL=https://loov.co.kr/api/deploy/webhook

            # 항상 컨테이너 재생성 (볼륨 마운트로 최신 빌드 적용)
            docker stop loov-app 2>/dev/null || true
            docker rm loov-app 2>/dev/null || true
            docker run -d \
              --name loov-app \
              --restart unless-stopped \
              -p 3100:3000 \
              --add-host=host.docker.internal:host-gateway \
              -v "${DIST_DIR}:/app" \
              -w /app \
              -e DEPLOY_SECRET="$DEPLOY_SECRET" \
              node:20-alpine \
              node server.js

            # 서버 기동 대기 후 웹훅 재시도 (최대 3회)
            sleep 25
            for i in 1 2 3; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d "{\"secret\":\"$DEPLOY_SECRET\",\"status\":\"success\",\"step\":\"배포 완료 ✓\",\"sha\":\"$SHA\"}")
              [ "$STATUS" = "200" ] && break
              sleep 10
            done

      - name: Notify — 실패
        if: failure()
        run: |
          curl -s -X POST $WEBHOOK_URL \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DEPLOY_SECRET }}\",\"status\":\"failed\",\"step\":\"배포 실패\",\"message\":\"https://github.com/hyperkh65/loov-app/actions\",\"sha\":\"${{ github.sha }}\"}" || true
