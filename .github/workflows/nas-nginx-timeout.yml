name: NAS nginx timeout 설정

on:
  workflow_dispatch:

jobs:
  set-timeout:
    runs-on: ubuntu-latest
    steps:
      - name: nginx 타임아웃 300초 설정
        uses: appleboy/ssh-action@v1
        with:
          host: hy64.synology.me
          username: urjent
          key: ${{ secrets.NAS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:/sbin:/usr/sbin:$PATH

            # loov.co.kr 관련 nginx 설정 파일 찾기
            echo "=== nginx conf 구조 ==="
            find /etc/nginx -name "*.conf" 2>/dev/null | head -30
            echo ""
            echo "=== loov 관련 설정 ==="
            grep -r "loov\|3100" /etc/nginx/ --include="*.conf" -l 2>/dev/null
            echo ""
            echo "=== 현재 proxy timeout 설정 ==="
            grep -r "proxy_read_timeout\|proxy_connect_timeout" /etc/nginx/ 2>/dev/null
