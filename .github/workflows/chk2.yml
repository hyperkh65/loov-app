name: chk2
on:
  push:
    branches: [dr-sync]
    paths: [.github/workflows/chk2.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          port: 79
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          envs: NAS2_PASS
          script: |
            echo "$NAS2_PASS" | sudo -S -p '' /usr/local/bin/docker ps --format '{{.Names}}' | tr '\n' ' '; echo
            for c in $(echo "$NAS2_PASS" | sudo -S -p '' /usr/local/bin/docker ps --format '{{.Names}}' | grep -i loov); do
              echo "=== $c"
              echo "$NAS2_PASS" | sudo -S -p '' /usr/local/bin/docker logs --since 150m $c 2>&1 | grep -iE "post-now|sns|instagram|telegram|bluesky|tumblr|backlink|publish|401|error|fetch failed" | cut -c1-260 | tail -40
            done
