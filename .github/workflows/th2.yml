name: th2
on:
  push:
    branches: [dr-sync]
    paths: [".github/workflows/th2.yml"]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          port: 79
          envs: NAS2_PASS
          command_timeout: 3m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            cat > /tmp/th2.sql <<'EOS'
            select 'WP '||left(id::text,8)||' | '||site_url from public.wordpress_sites order by site_url;
            select 'SRC '||left(s.id::text,8)||' | '||coalesce(to_jsonb(s)->>'name',to_jsonb(s)->>'site_name',to_jsonb(s)->>'site_url',to_jsonb(s)->>'url','?')||' | act='||coalesce(to_jsonb(s)->>'is_active','?')||' | wp='||coalesce(w.site_url,'(기본:miracool)')||' | route='||coalesce((((select a.settings->>'SNS_ACCOUNT_ROUTING_BY_SOURCE' from public.app_settings a where a.id=1)::jsonb)->(s.id::text))::text,'(기본:aboda_miracool)') from public.bossai_rewrite_sources s left join public.wordpress_sites w on w.id=s.publish_wp_site_id order by 1;
            select 'ABODA_ARTS7d '||h||' | src='||sid||' | n='||count(*) from (select coalesce(split_part(r.published_urls->>'wordpress','/',3),'(none)') h, left(coalesce(to_jsonb(r)->>'source_id',''),8) sid from public.bossai_rewrite_articles r where r.status='published' and r.published_at > now()-interval '7 days' and r.published_urls::text like '%aboda_miracool%') t group by h, sid order by 1;
            select 'SCHED '||left(sc.id::text,8)||' | '||coalesce(to_jsonb(sc)->>'name',to_jsonb(sc)->>'type','?')||' | type='||coalesce(to_jsonb(sc)->>'type',to_jsonb(sc)->>'schedule_type','?')||' | act='||coalesce(to_jsonb(sc)->>'is_active',to_jsonb(sc)->>'enabled','?')||' | sns='||coalesce(left((to_jsonb(sc)->'config'->'sns_account_ids')::text,120),'') from public.bossai_schedules sc where sc::text ilike '%aboda%' order by 1;
            select 'SCHEDCOUNT '||count(*) from public.bossai_schedules;
            EOS
            echo "$NAS2_PASS" | sudo -S sh -c "docker exec -i supabase-db psql -U postgres -d postgres < /tmp/th2.sql 2>&1"
            rm -f /tmp/th2.sql
