name: th2
on:
  push:
    branches: [dr-sync]
    paths: [".github/workflows/th2.yml"]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          port: 79
          envs: NAS2_PASS
          command_timeout: 3m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            cat > /tmp/th2.sql <<'EOS'
            select 'INFO_SRC '||s.id||' | '||coalesce(to_jsonb(s)->>'name','?')||' | '||coalesce(to_jsonb(s)->>'site_url','?')||' | act='||coalesce(to_jsonb(s)->>'is_active','?')||' | wp='||coalesce(w.site_url,'(기본)')||' | thumb='||coalesce(to_jsonb(s)->>'use_generated_thumbnail','?')||' | arts='||(select count(*) from public.bossai_rewrite_articles r where r.source_id=s.id)||' | pub='||(select count(*) from public.bossai_rewrite_articles r where r.source_id=s.id and r.status='published') from public.bossai_rewrite_sources s left join public.wordpress_sites w on w.id=s.publish_wp_site_id where s::text ilike '%infodemic%';
            EOS
            echo "$NAS2_PASS" | sudo -S sh -c "docker exec -i supabase-db psql -U postgres -d postgres < /tmp/th2.sql 2>&1"
            rm -f /tmp/th2.sql
