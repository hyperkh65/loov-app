name: th2
on:
  push:
    branches: [dr-sync]
    paths: [".github/workflows/th2.yml"]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          port: 79
          envs: NAS2_PASS
          command_timeout: 3m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            cat > /tmp/th2.sql <<'EOS'
            select 'KEY '||coalesce(to_jsonb(a)->>'key','?')||' len='||length(coalesce(to_jsonb(a)->>'value','')) from public.app_settings a where to_jsonb(a)->>'key' ~* 'OPENAI|NAVER|CLOUDFLARE|R2_|CRON';
            select 'ROUTE '||left(to_jsonb(a)->>'value',1500) from public.app_settings a where to_jsonb(a)->>'key'='SNS_ACCOUNT_ROUTING_BY_SOURCE';
            select 'WP '||id||' | '||site_url||' | nas='||coalesce(nas,'?') from public.wordpress_sites where site_url ilike '%2days.kr%' or site_url ilike '%miracool%';
            select 'SRC '||s.id||' | '||coalesce(to_jsonb(s)->>'name','?')||' | '||coalesce(to_jsonb(s)->>'site_url','?')||' | wp='||coalesce(w.site_url,'(기본)') from public.bossai_rewrite_sources s left join public.wordpress_sites w on w.id=s.publish_wp_site_id;
            select 'AGODA '||id||' | user='||user_id||' | '||left(config::text,0)||coalesce(config->>'blog_platform','?')||' wp_site='||coalesce(config->>'wp_site_id','-')||' sns='||coalesce(config->>'sns_platforms','-')||' style='||coalesce(config->>'travel_style','-')||' cities='||coalesce(jsonb_array_length(config->'cities'),0) from public.bossai_schedules where type ilike '%agoda%';
            EOS
            echo "$NAS2_PASS" | sudo -S sh -c "docker exec -i supabase-db psql -U postgres -d postgres < /tmp/th2.sql 2>&1"
            rm -f /tmp/th2.sql
