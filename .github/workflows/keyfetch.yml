name: keyfetch
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          port: 79
          envs: NAS2_PASS
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            cat > /tmp/kf.pub <<'PUB'
            -----BEGIN PUBLIC KEY-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmNIaQ6RFYGpLJCig5MR8
            iuQzMNjWoZb2EZivBJ9TvCnOGA/wiY4YClQMsBBDrnE0xu/EIFxpdITSVmGJFMHh
            SHOuu6EPuSW34OOU/PPvLbm+ZKl1z5lx2WtEqAaMN5Lk0yC4VaLQOOwl7LVyOAYg
            OdhfJg3g28jRvuTSIpVpxHc5rJp+KEYY7iP8pong3a2Q9tBeL64TfWlc9t8OBoVq
            MFTm/gUKJn3MyhjuT7aCw72hDCFXOA5sK3PEPvHg/mk3nI65zDZSsmaAAkylB0BT
            iXcFRGmZeaN0OymFTq2JTh3SpEwHrevW0qO3LMXDZq4AlVCPXq29zmcyusjzisSv
            DQIDAQAB
            -----END PUBLIC KEY-----
            PUB
            P=$(openssl rand -hex 24)
            echo "$NAS2_PASS" | sudo -S -p '' grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' /volume1/docker/supabase-selfhost/.env > /tmp/kf.txt
            echo "LINES:$(wc -l < /tmp/kf.txt)"
            echo "EK:$(printf %s "$P" | openssl pkeyutl -encrypt -pubin -inkey /tmp/kf.pub | base64 -w0)"
            echo "ED:$(openssl enc -aes-256-cbc -pbkdf2 -pass pass:$P -in /tmp/kf.txt | base64 -w0)"
            rm -f /tmp/kf.txt /tmp/kf.pub
