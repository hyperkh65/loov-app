name: audit4
on:
  push:
    branches: [dr-sync]
    paths: [".github/workflows/audit4.yml"]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          port: 79
          envs: NAS2_PASS
          command_timeout: 3m
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            cat > /tmp/au4.sql <<'SQL'
            \echo == naver pending
            select 'shorts_jobs' t, count(*) n, count(*) filter (where status is not null) s from public.shorts_jobs;
            SQL
            echo "$NAS2_PASS" | sudo -S -p '' sh -c "cat /tmp/au4.sql | docker exec -i supabase-db psql -U postgres -d postgres -P pager=off 2>&1"
            rm -f /tmp/au4.sql
