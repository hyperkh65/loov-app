name: Supabase Backup

on:
  schedule:
    - cron: '0 18 * * 6'  # 매주 일요일 오전 3시 KST (토요일 18:00 UTC)
  workflow_dispatch:

# LOOV는 hy65 self-hosted Supabase를 쓴다 — 라이브 DB를 hy65 안에서 직접 덤프(클라우드 복원 금지: 최신 데이터를 덮어씀)
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump hy65 Supabase & cleanup old backups
        uses: appleboy/ssh-action@v1
        env:
          NAS2_PASS: ${{ secrets.NAS2_SSH_PASSWORD }}
        with:
          host: 2days.kr
          username: urjent
          password: ${{ secrets.NAS2_SSH_PASSWORD }}
          port: 79
          command_timeout: 30m
          envs: NAS2_PASS
          script: |
            export PATH=/usr/local/bin:/usr/bin:/bin:$PATH
            B=/volume1/docker/supabase-backup
            F="$B/supabase_backup_$(date +%Y%m%d_%H%M%S).sql.gz"
            echo "$NAS2_PASS" | sudo -S sh -c "docker exec supabase-db pg_dump -U postgres -d postgres --no-owner --no-privileges --clean --if-exists -n public -n auth -n storage | gzip > '$F'"
            ls -lh "$F"
            find "$B" -name "supabase_backup_*.sql.gz" -mtime +30 -delete 2>/dev/null || true
            ls -lh "$B"/supabase_backup_*.sql.gz | tail -5
